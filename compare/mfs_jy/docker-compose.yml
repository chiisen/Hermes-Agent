services:
    laravel.test:
        build:
            context: "./docker/8.4"
            dockerfile: Dockerfile
            args:
                WWWGROUP: "${WWWGROUP}"
        image: "sail-8.4/app"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "${FORWARD_HTTP_PORT:-80}:80"
            - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
        environment:
            WWWUSER: "${WWWUSER}"
            DB_HOST: "${DB_HOST}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
            APP_COLOR: "dev"
            DB_QUEUE: "default_dev"
            REDIS_QUEUE: "default_dev"
            # SSH 動態連接埠轉發 (SSH SOCKS5 Proxy)
            # ALL_PROXY: socks5h://host.docker.internal:8888
            # HTTP_PROXY: socks5h://host.docker.internal:8888
            # HTTPS_PROXY: socks5h://host.docker.internal:8888
            # NO_PROXY: localhost,127.0.0.1,nginx,mysql,redis,meilisearch,mailpit,selenium,*.local
        volumes:
            - ".:/var/www/html"
            - "../docker/assets/gh-ost:/usr/local/bin/gh-ost"
        networks:
            - sail
        depends_on:
            - mysql
            - redis
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        restart: always
        ports:
            - "${FORWARD_PHPMYADMIN_PORT:-3307}:80"
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            PMA_HOST: mysql
            PMA_USER: root
            PMA_PASSWORD: ${DB_PASSWORD}
        networks:
            - sail
    mysql:
        image: "mysql/mysql-server:8.0"
        ports:
            - "${FORWARD_DB_PORT:-3306}:3306"
        environment:
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
            MYSQL_ROOT_HOST: "%"
            MYSQL_DATABASE: "${DB_DATABASE}"
            MYSQL_USER: "${DB_USERNAME}"
            MYSQL_PASSWORD: "${DB_PASSWORD}"
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - "sail-mysql:/var/lib/mysql"
            - "./docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh"
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - "-p${DB_PASSWORD}"
            retries: 3
            timeout: 5s
    redis:
        image: "redis:alpine"
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - "sail-redis:/data"
        networks:
            - sail
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    redis-insight:
        image: redis/redisinsight:latest
        restart: unless-stopped
        ports:
            - "${FORWARD_REDIS_INSIGHT_PORT:-5540}:5540"
        volumes:
            - sail-redis-insight:/data
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    sail-redis-insight:
        driver: local
